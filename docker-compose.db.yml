services:
  day20-db:
    restart: unless-stopped
    image: mongo:8
    container_name: day20-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - day20-network

  day20-api:
    environment:
      - MONGO_URI=mongodb://day20-db:27017/day20
    depends_on:
      - day20-db

networks:
  day20-network:
    driver: bridge
